name: Daily Review Email

on:
  schedule:
    - cron: '0 10 * * *'  # 7:00 AM Argentina (UTC-3)
  workflow_dispatch:        # permite dispararlo manualmente desde la pestaña Actions

jobs:
  send-review:
    runs-on: ubuntu-latest

    steps:
      - name: Enviar repasos del día a Things
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_USER_ID:          ${{ secrets.SUPABASE_USER_ID }}
          GMAIL_USER:                ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:        ${{ secrets.GMAIL_APP_PASSWORD }}
          THINGS_EMAIL:              ${{ secrets.THINGS_EMAIL }}
        run: |
          python3 << 'EOF'
          import json, datetime, smtplib, os, sys
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          from email.mime.text import MIMEText

          supabase_url = os.environ['SUPABASE_URL'].rstrip('/')
          service_key  = os.environ['SUPABASE_SERVICE_ROLE_KEY']
          user_id      = os.environ['SUPABASE_USER_ID']
          today        = datetime.date.today().isoformat()

          # Consultar temas pendientes desde Supabase (PostgREST)
          url = (
              f"{supabase_url}/rest/v1/temas"
              f"?user_id=eq.{user_id}"
              f"&active=eq.true"
              f"&next_review=lte.{today}"
              f"&select=nombre,materia"
          )
          req = Request(url, headers={
              'apikey':        service_key,
              'Authorization': f'Bearer {service_key}',
              'Accept':        'application/json'
          })
          try:
              with urlopen(req) as resp:
                  due = json.loads(resp.read().decode())
          except HTTPError as e:
              print(f'ERROR consultando Supabase: {e.code} {e.reason}')
              sys.exit(1)

          if not due:
              print('Sin temas pendientes hoy, no se envían correos.')
              sys.exit(0)

          gmail_user   = os.environ.get('GMAIL_USER', '').strip()
          gmail_pass   = os.environ.get('GMAIL_APP_PASSWORD', '').strip()
          things_email = os.environ.get('THINGS_EMAIL', '').strip()

          if not gmail_user:   print('ERROR: falta GMAIL_USER'); sys.exit(1)
          if not gmail_pass:   print('ERROR: falta GMAIL_APP_PASSWORD'); sys.exit(1)
          if not things_email: print('ERROR: falta THINGS_EMAIL'); sys.exit(1)

          with smtplib.SMTP_SSL('smtp.gmail.com', 465) as server:
              server.login(gmail_user, gmail_pass)
              for tema in due:
                  msg = MIMEText(
                      f"Materia: {tema['materia']}\nRepaso del {today}",
                      'plain', 'utf-8'
                  )
                  msg['Subject'] = f"📚 {tema['nombre']}"
                  msg['From']    = gmail_user
                  msg['To']      = things_email
                  server.send_message(msg)
                  print(f"✓ Enviado: {tema['nombre']}")

          print(f"\nTotal: {len(due)} tema(s) enviado(s).")
          EOF
